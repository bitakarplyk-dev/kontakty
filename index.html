<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фотоцентр — контакти</title>
<meta name="description" content="Фотоцентр на Печерській площі 1 — зв'яжіться з нами в Telegram, Viber, WhatsApp або поштою">
<style>
  :root {
    --bg: #121417;
    --card: #1c1f24;
    --card-hover: #252930;
    --text: #eef0f3;
    --muted: #9aa1ab;
    --border: #2c3038;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  header { text-align: center; margin-bottom: 28px; }
  .logo { width: 100%; max-width: 300px; margin: 0 auto 22px; }
  .logo img { width: 100%; height: auto; display: block; }
  .ws  { background: #2a7fd4; }
  h1 { font-size: 22px; font-weight: 700; line-height: 1.3; }
  header p { color: var(--muted); margin-top: 6px; font-size: 15px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.btn {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    transition: background .15s, transform .1s;
  }
  a.btn:hover { background: var(--card-hover); }
  a.btn:active { transform: scale(.98); }
  .ico {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .ico svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .t { display: flex; flex-direction: column; }
  .t b { font-size: 16px; font-weight: 600; }
  .t span { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tg  { background: #2aa3df; }
  .vb  { background: #7b5cd6; }
  .wa  { background: #2fb760; }
  .ph  { background: #e08a2e; }
  .ml  { background: #5a6270; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 28px; }
</style>
</head>
